name: KairoSphere device preview

on:
  push:
    branches:
      - feature/kairosphere-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kairosphere-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run automated tests
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload device-preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
